<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BlogToBook turns scattered posts into one chronological EPUB for your e-reader</title>
  <desc id="desc">Article cards flow through BlogToBook into a single book and a generic e-reader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1226"/><stop offset=".54" stop-color="#172554"/><stop offset="1" stop-color="#26114f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#e9e2cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
    <style>
      .k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.ey{font-size:22px;font-weight:700;letter-spacing:4px;fill:#7dd3fc}.label{font-size:29px;font-weight:700;fill:#fff}.sub{font-size:19px;fill:#b8c7e8}.tiny{font-size:16px;fill:#7d91b8}.cardTitle{font-size:17px;font-weight:700;fill:#1e293b}.cardText{font-size:12px;fill:#64748b}.bookTitle{font-size:25px;font-weight:800;fill:#172554}.bookText{font-size:15px;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="179" cy="174" r="240" fill="#0ea5e9" opacity=".13"/><circle cx="1430" cy="725" r="310" fill="#7c3aed" opacity=".18"/>
  <text x="800" y="88" text-anchor="middle" class="k ey">BLOGTOBOOK</text>
  <text x="800" y="137" text-anchor="middle" class="k" font-size="38" font-weight="800" fill="#fff">From scattered posts to one chronological book.</text>
  <!-- article cards -->
  <g filter="url(#shadow)" transform="translate(105 300) rotate(-8)"><rect width="230" height="265" rx="18" fill="#fff"/><rect x="22" y="23" width="186" height="12" rx="6" fill="#dbeafe"/><rect x="22" y="55" width="150" height="15" rx="7" fill="#1e293b"/><rect x="22" y="88" width="180" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="108" width="158" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="181" width="103" height="30" rx="15" fill="#dcfce7"/><text x="73" y="202" text-anchor="middle" class="k cardText">2016 post</text></g>
  <g filter="url(#shadow)" transform="translate(225 235) rotate(5)"><rect width="230" height="265" rx="18" fill="#fff"/><rect x="22" y="23" width="186" height="12" rx="6" fill="#e9d5ff"/><rect x="22" y="55" width="162" height="15" rx="7" fill="#1e293b"/><rect x="22" y="88" width="180" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="108" width="145" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="181" width="103" height="30" rx="15" fill="#f3e8ff"/><text x="73" y="202" text-anchor="middle" class="k cardText">2020 post</text></g>
  <g filter="url(#shadow)" transform="translate(335 320) rotate(10)"><rect width="230" height="265" rx="18" fill="#fff"/><rect x="22" y="23" width="186" height="12" rx="6" fill="#bae6fd"/><rect x="22" y="55" width="138" height="15" rx="7" fill="#1e293b"/><rect x="22" y="88" width="180" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="108" width="166" height="9" rx="4" fill="#cbd5e1"/><rect x="22" y="181" width="103" height="30" rx="15" fill="#e0f2fe"/><text x="73" y="202" text-anchor="middle" class="k cardText">2024 post</text></g>
  <text x="310" y="650" text-anchor="middle" class="k label">Scattered blog &amp; newsletter posts</text>
  <text x="310" y="684" text-anchor="middle" class="k sub">The archive you already want to read</text>
  <!-- arrow 1 --> <path d="M585 450h100" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/><path d="m670 425 33 25-33 25" fill="none" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- branded engine -->
  <g filter="url(#shadow)"><rect x="714" y="258" width="240" height="390" rx="40" fill="url(#accent)"/><rect x="720" y="264" width="228" height="378" rx="34" fill="#111c42" opacity=".28"/><image href="assets/icon.png" x="760" y="305" width="148" height="148" preserveAspectRatio="xMidYMid meet"/><text x="834" y="507" text-anchor="middle" class="k" font-size="30" font-weight="800" fill="#fff">BlogToBook</text><text x="834" y="543" text-anchor="middle" class="k" font-size="17" fill="#dbeafe">Collect · review · export</text></g>
  <!-- arrow 2 --> <path d="M972 450h100" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/><path d="m1057 425 33 25-33 25" fill="none" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- book -->
  <g filter="url(#shadow)"><path d="M1105 260c82-22 154-9 206 34v324c-52-42-124-55-206-34z" fill="url(#paper)"/><path d="M1311 294c52-43 124-56 206-34v324c-82-21-154-8-206 34z" fill="url(#paper)"/><path d="M1311 294v324" stroke="#c7bda6" stroke-width="4"/><g stroke="#b8b1a6" stroke-width="8" stroke-linecap="round"><path d="M1140 340h126"/><path d="M1140 375h110"/><path d="M1140 410h120"/><path d="M1355 340h125"/><path d="M1355 375h109"/><path d="M1355 410h120"/></g><rect x="1278" y="570" width="50" height="98" rx="2" fill="#f97316"/></g>
  <text x="1312" y="722" text-anchor="middle" class="k label">One chronological EPUB</text>
  <text x="1312" y="756" text-anchor="middle" class="k sub">A coherent book, ready to read</text>
  <!-- reader -->
  <g transform="translate(1310 95)" filter="url(#shadow)"><rect width="160" height="126" rx="15" fill="#111827"/><rect x="12" y="12" width="136" height="102" rx="6" fill="#f8fafc"/><path d="M39 48h82M39 64h70M39 80h78" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="120" r="5" fill="#64748b"/></g><text x="1390" y="248" text-anchor="middle" class="k tiny">Read on your e-reader</text>
  <text x="800" y="840" text-anchor="middle" class="k" font-size="22" fill="#b8c7e8">No account · Local processing on your Mac · Offline EPUB</text>
</svg>
